<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}RC Select{% endblock %}</title>

  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #f4f4f4;
      font-family: Arial, Helvetica, sans-serif;
    }

    .container {
      max-width: 600px;
      margin: 20px auto;
      background-color: #ffffff;
      padding: 20px;
      border: 1px solid #e0e0e0;
    }

    .header {
      font-size: 18px;
      font-weight: bold;
      margin-bottom: 15px;
      color: #333333;
    }

    .subtext {
      font-size: 14px;
      margin-bottom: 20px;
      color: #555555;
    }

    .row {
      display: flex;
      padding: 8px 0;
      border-bottom: 1px solid #eeeeee;
      font-size: 14px;
    }

    .label {
      width: 40%;
      font-weight: bold;
      color: #444444;
    }

    .value {
      width: 60%;
      color: #000000;
    }

    .footer {
      margin-top: 20px;
      font-size: 12px;
      color: #888888;
    }

    @media only screen and (max-width: 600px) {
      .row {
        flex-direction: column;
      }
      .label, .value {
        width: 100%;
      }
    }
  </style>
</head>

<body>
  <div class="container">

    <div class="header">
      {% block header %}{% endblock %}
    </div>

    <div class="subtext">
      {% block subtext %}{% endblock %}
    </div>

    {% block content %}
    {% endblock %}

    <div class="footer">
      This email was generated automatically by RC Select Platform.
    </div>

  </div>
</body>
</html>
