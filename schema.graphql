type AppEnumCollection {
  QuestionTypeEnum: [AppEnumCollectionQuestionTypeEnum!]!
  OrdinalTypeEnum: [AppEnumCollectionOrdinalTypeEnum!]!
}

type AppEnumCollectionOrdinalTypeEnum {
  key: OrdinalTypeEnum!
  label: String!
}

type AppEnumCollectionQuestionTypeEnum {
  key: QuestionTypeEnum!
  label: String!
}

"""
Catalog(id, created_at, modified_at, created_by, modified_by, name, description)
"""
input CatalogFilter {
  id: ID
  AND: CatalogFilter
  OR: CatalogFilter
  NOT: CatalogFilter
  DISTINCT: Boolean
}

input CatalogOrder {
  id: Ordering
}

"""
Catalog(id, created_at, modified_at, created_by, modified_by, name, description)
"""
type CatalogType {
  id: ID!
  name: String!
  description: String!
  questions: [QuestionType!]!
}

type CatalogTypeOffsetPaginated {
  pageInfo: OffsetPaginationInfo!

  """Total count of existing results."""
  totalCount: Int!

  """List of paginated results."""
  results: [CatalogType!]!
}

"""
CheckboxOption(id, created_at, modified_at, created_by, modified_by, question, text, order)
"""
type CheckboxOptionType {
  id: ID!
  questionId: ID!
  order: Int!
  text: String!
}

type DjangoFileType {
  name: String!
  size: Int!
  url: String!
}

type OffsetPaginationInfo {
  offset: Int!
  limit: Int
}

input OffsetPaginationInput {
  offset: Int! = 0
  limit: Int
}

enum Ordering {
  ASC
  ASC_NULLS_FIRST
  ASC_NULLS_LAST
  DESC
  DESC_NULLS_FIRST
  DESC_NULLS_LAST
}

enum OrdinalTypeEnum {
  NOT_AVAILABLE
  ONE
  TWO
  THREE
  FOUR
}

type Query {
  catalog(id: ID!): CatalogType!
  tool(id: ID!): ToolType!
  catalogs(filters: CatalogFilter, order: CatalogOrder, pagination: OffsetPaginationInput): CatalogTypeOffsetPaginated!
  tools(filters: ToolFilter, order: ToolOrder, pagination: OffsetPaginationInput): ToolTypeOffsetPaginated!
  enums: AppEnumCollection!
}

"""
Question(id, created_at, modified_at, created_by, modified_by, catalog, question_type, title, description, order, label_na, label_1, label_2, label_3, label_4)
"""
type QuestionType {
  id: ID!
  catalogId: ID!
  questionType: QuestionTypeEnum!
  title: String!
  description: String!
  order: Int!
  labelNa: String!
  label1: String!
  label2: String!
  label3: String!
  label4: String!
  options: [CheckboxOptionType!]!
}

enum QuestionTypeEnum {
  ORDINAL
  CHECKBOX
}

"""
ToolAnswer(id, created_at, modified_at, created_by, modified_by, tool, description, question, ordinal_value)
"""
type ToolAnswerType {
  id: ID!
  toolId: ID!
  questionId: ID!
  description: String!
  ordinalValue: OrdinalTypeEnum
  selectedOptions: [CheckboxOptionType!]!
}

"""
Tool(id, created_at, modified_at, created_by, modified_by, catalog, name, tagline, description, video_link, tool_link, logo)
"""
input ToolFilter {
  id: ID
  AND: ToolFilter
  OR: ToolFilter
  NOT: ToolFilter
  DISTINCT: Boolean
}

input ToolOrder {
  id: Ordering
}

"""
Tool(id, created_at, modified_at, created_by, modified_by, catalog, name, tagline, description, video_link, tool_link, logo)
"""
type ToolType {
  id: ID!
  catalog: CatalogType!
  name: String!
  tagline: String!
  description: String!
  videoLink: String
  toolLink: String
  logo: DjangoFileType
  answers: [ToolAnswerType!]!
}

type ToolTypeOffsetPaginated {
  pageInfo: OffsetPaginationInfo!

  """Total count of existing results."""
  totalCount: Int!

  """List of paginated results."""
  results: [ToolType!]!
}